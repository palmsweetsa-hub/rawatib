<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الرواتب">
<meta name="theme-color" content="#14233F">
<meta name="robots" content="noindex, nofollow">
<title>تجربة — نظام شواطئ النخيل</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--n:#14233F;--n2:#1D3156;--gd:#B8892B;--gd2:#F3E7CF;--gd3:#8A6516;--cr:#F6F3EC;--ink:#1B2333;--mu:#5F6672;--ln:#ECE6DA;--b:#14233F;--b2:#E8EEF9;--g:#1E6B34;--g2:#E2EFDA;--r:#B42318;--r2:#FDECEC;--a:#8A5A00;--a2:#FFF4D6;--line:#ECE6DA;--bg:#F6F3EC;--sb:248px}
*{box-sizing:border-box;font-family:Tajawal,Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cr);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
a{color:var(--gd3)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}.ph small{display:block;color:var(--mu);font-size:13px;font-weight:500}
.ph .acts{display:flex;gap:8px;align-items:center}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid #E2DCCF;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none;transition:transform .15s}
.ib:active{transform:scale(.94)}.ib .bdot{position:absolute;top:9px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--gd)}
.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--ln)}
h2{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h3{font-size:13px;font-weight:700;color:var(--mu);margin:20px 4px 10px}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:14px 0 6px}
.req:after{content:" *";color:var(--r)}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid #E2DCCF;border-radius:14px;font-size:16px;background:#FFFDF9;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--n);box-shadow:0 0 0 3px rgba(184,137,43,.22)}
select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235F6672' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 14px center;padding-left:36px}
input[type=checkbox]{width:20px;min-height:20px;height:20px;vertical-align:middle;accent-color:var(--n)}
input[type=file]{padding:10px}
textarea{min-height:80px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border:0;border-radius:25px;font-size:15px;font-weight:700;background:var(--n);color:#fff;margin-top:14px;text-decoration:none;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--g)}.btn.wa{background:#1F9D55}.btn.r{background:var(--r)}.btn.l{background:#EFEAE0;color:var(--ink)}.btn.gd{background:var(--gd);color:var(--n)}
.btn.sm{display:inline-flex;width:auto;min-height:40px;padding:8px 16px;font-size:13.5px;margin:8px 0 0 8px}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:30%;min-height:46px;padding:10px;border:1.5px solid #E2DCCF;background:#fff;border-radius:14px;font-size:14.5px;font-weight:700;color:var(--ink);transition:all .15s}
.seg button.on{border-color:var(--n);background:var(--n);color:#fff}
.hint{border-radius:14px;padding:10px 12px;font-size:13.5px;margin-top:10px;background:var(--b2);color:#1E3A8A}
.hint.r{background:var(--r2);color:var(--r)}.hint.g{background:var(--g2);color:var(--g)}.hint.a{background:var(--a2);color:var(--a)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:20px;padding:14px;border:1px solid var(--ln)}
.kpi small{color:var(--mu);font-size:12.5px;display:block}.kpi b{font-size:22px;font-weight:800;color:var(--ink)}
.kpi.w b{color:var(--r)}.kpi.ok b{color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0ECE3;gap:12px}
.row:last-child{border-bottom:0}.row>div:first-child:not(.stamp),.rx{flex:1;min-width:0}
.row b{font-weight:700}.row small{display:block;color:var(--mu);font-size:12px}.row .v{font-weight:800;color:var(--n);white-space:nowrap;font-size:15.5px;text-align:left}
.clk{cursor:pointer;transition:background .15s}.clk:active{background:#FAF7F1}
.av{width:42px;height:42px;border-radius:14px;background:#EEF1F6;color:var(--n);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.st{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:10px;font-weight:700;margin-right:4px;white-space:nowrap;vertical-align:middle}
.s1{background:var(--g2);color:var(--g)}.s2{background:var(--a2);color:var(--a)}.s3{background:#EFEDE8;color:#5F6672}.s4{background:var(--r2);color:var(--r)}.s5{background:var(--b2);color:#1E3A8A}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0ECE3;font-size:14px;gap:10px}
.kv:last-child{border-bottom:0}.kv span{color:var(--mu)}.kv b{color:var(--ink);font-weight:700;text-align:left}
.scroll{overflow-x:auto;border:1px solid var(--ln);border-radius:16px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#FAF7F1;color:var(--mu);padding:10px 8px;font-weight:700;white-space:nowrap;font-size:12px;border-bottom:1px solid var(--ln)}
td{border-bottom:1px solid #F3EFE7;padding:10px 8px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:right;position:sticky;right:0;background:inherit}
tr{background:#fff}tr.tot td{font-weight:800;background:var(--gd2);color:var(--gd3);border-bottom:0}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:6px 16px;border-radius:19px;border:1px solid #E2DCCF;background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);transition:all .15s}
.chips button.on{background:var(--n);color:#fff;border-color:var(--n);font-weight:700}
.pick{border:1.5px solid #E2DCCF;border-radius:16px;padding:13px 14px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#fff;transition:all .15s}
.pick.on{border-color:var(--n);background:#EEF1F6;box-shadow:inset 0 0 0 1px var(--n)}.pick.off{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(20,35,63,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s ease}
.modal>.card{width:100%;max-width:560px;max-height:90vh;overflow:auto;margin:0;border:0;border-radius:28px 28px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom));animation:sheet .28s cubic-bezier(.2,.8,.2,1);position:relative}
.modal>.card:before{content:"";position:absolute;top:9px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#DDD6C8}
.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:14px;font-size:14px}
.msg.err{display:block;background:var(--r2);color:var(--r)}.msg.ok{display:block;background:var(--g2);color:var(--g)}
.muted{color:var(--mu);font-size:13px}
.hide{display:none}
.flagged{border:1.5px solid #E8A5A0;box-shadow:inset 0 0 0 1px #F6D2CF}
.toast{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;z-index:50;box-shadow:0 10px 24px rgba(20,35,63,.25);animation:fade .2s}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
/* هيكل التحميل والحالات */
.sk{background:linear-gradient(90deg,#EDE8DD 0%,#F7F3EB 50%,#EDE8DD 100%);background-size:200% 100%;animation:shim 1.2s infinite linear;border-radius:12px}
.empty{text-align:center;padding:28px 16px}.empty .ei{width:64px;height:64px;border-radius:22px;background:var(--gd2);color:var(--gd3);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty b{display:block;font-size:16px;font-weight:800}.empty p{margin:4px 0 0;color:var(--mu);font-size:13.5px}
.empty.err .ei{background:var(--r2);color:var(--r)}
/* الملخص */
.hero{background:var(--n);color:#fff;margin:-16px -16px 0;padding:18px 16px 18px;border-radius:0 0 30px 30px}
.htop{display:flex;align-items:center;gap:12px}.hlogo{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);padding:9px;flex:none}
.hhi{flex:1;min-width:0}.hhi small{display:block;font-size:12px;color:#C9B27A}.hhi b{font-size:19px;font-weight:700}
.hero .ib{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.bal{margin-top:16px;background:#fff;color:var(--ink);border-radius:24px;padding:18px 16px 14px}
.bal-l{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mu)}.bal-l em{font-style:normal;font-size:11px;font-weight:700;color:var(--gd3);background:var(--gd2);padding:3px 9px;border-radius:10px}
.bal-v{font-size:36px;font-weight:800;color:var(--n);letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}.bal-v small{font-size:14px;font-weight:500;color:var(--mu)}
.bal-run{margin-top:14px;padding-top:12px;border-top:1px solid #EFEBE2}.bal-rh{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:10px}.bal-rh b{color:var(--ink)}
.stp{position:relative;display:flex}.stp:before{content:"";position:absolute;top:6px;right:12.5%;left:12.5%;height:2px;background:#E3E7EE}
.stp>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--mu);text-align:center}
.stp i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #D5DAE3;box-sizing:border-box}
.stp .dn i{background:var(--g);border-color:var(--g)}.stp .dn{color:var(--g)}.stp .cur i{background:var(--gd);border:3px solid var(--gd2)}.stp .cur{color:var(--ink);font-weight:700}
.qa{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}.qa::-webkit-scrollbar{display:none}
.qbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:21px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-size:13.5px;font-weight:500}
.qbtn.gd{background:var(--gd);border-color:var(--gd);color:var(--n);font-weight:700}
.dgrid{margin-top:16px}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.bx{background:#fff;border-radius:20px;padding:14px;border:1px solid var(--ln);text-align:right;color:var(--ink);transition:transform .15s}.bx:active{transform:scale(.98)}
.bx small{display:block;font-size:12px;color:var(--mu)}.bx b{display:block;margin-top:6px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.bx b span{font-size:12px;font-weight:500;color:var(--mu)}
.bx.gold{background:var(--gd2);border-color:#EADBBD}.bx.gold small,.bx.gold b,.bx.gold b span{color:var(--gd3)}
.dec{background:#FFFDF8;border:1.5px solid #E2C98F;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dec small{display:block;font-size:11.5px;font-weight:700;color:var(--gd3)}.dec b{font-size:14px;font-weight:700}.dec .btn{margin:0;width:auto;min-height:40px;padding:0 16px;font-size:13px;flex:none}
.dec.red{border-color:#E8A5A0;background:#FFF9F8}
#needc .dec{margin-bottom:8px}.dec.red small{color:var(--r)}
.stamp{width:48px;flex:none;text-align:center;border-radius:14px;background:var(--cr);padding:6px 0}.stamp b{display:block;font-size:17px;font-weight:800;color:var(--n);line-height:1.1}.stamp small{display:block;font-size:10.5px;color:var(--mu)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.sec-h h2{margin:0}.sec-h a,.sec-h button.lnk{font-size:12.5px;font-weight:700;color:var(--gd3);background:none;border:0;padding:6px 0;text-decoration:none}
/* كرت الموظف */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}.prof .av{width:64px;height:64px;border-radius:22px;background:var(--n);color:var(--gd);font-size:26px}
.prof h1{margin:0;font-size:22px;font-weight:800}.prof small{display:block;color:var(--mu);font-size:13px}
.navyc{background:var(--n);color:#fff;border-radius:24px;padding:16px;margin-bottom:12px}.navyc small{color:#C9B27A;font-size:12.5px}.navyc .big{font-size:32px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.navyc .big span{font-size:13px;font-weight:500;color:#AEB8CC}
.navyc .acts{display:flex;gap:8px;margin-top:12px}.navyc .acts button{flex:1;min-height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-size:13.5px;font-weight:500}.navyc .acts button.gd{background:var(--gd);border-color:var(--gd);color:var(--n);font-weight:700}
.navyc .hint{background:rgba(255,255,255,.08);color:#F3E7CF}
.tsp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}.tsp small{display:block;font-size:11.5px}.tsp b{font-size:15px;font-variant-numeric:tabular-nums}
.bmt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.bmt th{font-weight:500;color:var(--mu);font-size:12.5px;text-align:right;padding:6px 4px}.bmt td{padding:10px 4px;border-top:1px solid #F0ECE3}.bmt th:first-child{width:36%}.bmt tr.pt td{background:var(--a2);color:var(--a)}.bmt tr.pt td:first-child{border-radius:0 10px 10px 0}.bmt tr.pt td:last-child{border-radius:10px 0 0 10px}.bmt .ok{color:var(--g);font-weight:700}.bmt .rm{font-weight:700;color:var(--n)}.bmt tr.pt .rm{color:var(--a)}.bmt tr.sep td{padding:8px 4px 2px;font-size:12px;color:var(--mu);border-top:0}
.alc{display:block;font-size:12px;color:var(--gd3);margin-top:2px}
.bar{height:7px;border-radius:4px;background:#EEF0F4;overflow:hidden;margin-top:8px;display:flex}.bar i{display:block;height:100%;border-radius:4px;background:var(--gd)}
.lg{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}
/* شريط التنقل */
.fnav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:520px;margin:0 auto;height:66px;border-radius:33px;background:var(--n);display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-shadow:0 12px 30px rgba(20,35,63,.3);z-index:30}
.fnav .ni{width:46px;height:46px;border-radius:23px;border:0;background:transparent;color:#AEB8CC;display:flex;align-items:center;justify-content:center;gap:6px;flex:none;position:relative;transition:all .2s;white-space:nowrap;overflow:hidden}
.fnav .ni span{display:none;font-size:13px;font-weight:700}
.fnav .ni.on{width:auto;padding:0 14px;background:#fff;color:var(--n)}.fnav .ni.on span{display:inline}
.fnav .fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--gd);color:var(--n);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s}.fnav .fab:active{transform:scale(.92)}
.fnav .bdot,.side .bdot{position:absolute;top:8px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--gd)}
.side{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:18px;border:1px solid var(--ln);background:#FFFDF9;color:var(--ink);font-size:13.5px;font-weight:700;position:relative}
.tile .ti{width:44px;height:44px;border-radius:14px;background:#EEF1F6;color:var(--n);display:flex;align-items:center;justify-content:center}
.tile.on{border-color:var(--n);box-shadow:inset 0 0 0 1px var(--n)}.tile.out .ti{background:var(--r2);color:var(--r)}
/* الدخول */
.login{min-height:100vh;min-height:100dvh;background:var(--n);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px}
.login .lg-top{text-align:center;color:#fff;margin-bottom:22px}.login .lg-top img{width:84px;height:84px}.login .lg-top b{display:block;font-size:24px;font-weight:800;margin-top:10px}.login .lg-top small{color:#C9B27A;font-size:14px}
.login .card{width:100%;max-width:400px;border:0;border-radius:28px;padding:22px 20px}
.login .pin{letter-spacing:12px;text-align:center;font-size:22px;font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
#view>*{animation:up .32s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(5){animation-delay:.16s}#view>*:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{max-width:760px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:700px){.modal{align-items:center;padding:20px}.modal>.card{border-radius:28px;padding:24px 22px}.modal>.card:before{display:none}}
@media (min-width:960px){
body{padding-right:var(--sb)}
.fnav{display:none}
.side{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:var(--sb);background:var(--n);color:#fff;padding:22px 16px;z-index:30}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.1)}.side .brand img{width:40px;height:40px}.side .brand b{display:block;font-size:16px}.side .brand small{color:#C9B27A;font-size:12px}
.side .new{margin:18px 0 10px}
.side nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto}
.side .si{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;border:0;background:transparent;color:#C8D0DE;font-size:14.5px;font-weight:500;text-align:right;position:relative;transition:background .15s}

function tkThumb_(b) { tkGetPic_(b.dataset.pt, b.dataset.pic).then(function (r) { b.innerHTML = '<img src="' + r.data + '" alt="صورة الدليل">'; }).catch(function () {}); }
function tkPic_(tid, fid) {
  var d = modal('<div id="tkpz" style="text-align:center">' + skel() + '</div>');
  tkGetPic_(tid, fid).then(function (r) { d.querySelector('#tkpz').innerHTML = '<img src="' + r.data + '" alt="صورة الدليل" style="max-width:100%;border-radius:16px">' + (r.url ? '<a class="btn l" target="_blank" rel="noopener" href="' + esc(r.url) + '">افتحها في درايف</a>' : ''); }).catch(function (e) { d.querySelector('#tkpz').innerHTML = empty('alert', 'ما قدرت أفتح الصورة', esc(e.message)); });
}
function tkStepsUi_(box, steps) {
  var draw = function () {
    box.innerHTML = steps.map(function (s, i) { return '<div class="tksr"><input value="' + esc(s.t) + '" data-i="' + i + '" placeholder="الخطوة ' + (i + 1) + '" aria-label="الخطوة ' + (i + 1) + '"><select data-n="' + i + '" aria-label="الدليل المطلوب"><option value="">بدون دليل</option><option value="photo"' + (s.need === 'photo' ? ' selected' : '') + '>صورة إلزامية</option><option value="note"' + (s.need === 'note' ? ' selected' : '') + '>ملاحظة إلزامية</option></select><button type="button" class="ib" data-rm="' + i + '" aria-label="شيل الخطوة">×</button></div>'; }).join('') + '<button type="button" class="btn l" style="margin:6px 0 0;min-height:42px" data-add="1">+ أضف خطوة</button>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-i]'), function (e) { e.oninput = function () { steps[e.dataset.i].t = e.value; }; });
    Array.prototype.forEach.call(box.querySelectorAll('[data-n]'), function (e) { e.onchange = function () { steps[e.dataset.n].need = e.value; }; });
    Array.prototype.forEach.call(box.querySelectorAll('[data-rm]'), function (e) { e.onclick = function () { steps.splice(Number(e.dataset.rm), 1); draw(); }; });
    box.querySelector('[data-add]').onclick = function () { if (steps.length < 10) { steps.push({t: '', need: ''}); draw(); } };
  };
  draw();
}
function tkPick_(d, key, val, opts) { return '<div class="seg" style="gap:6px" data-pk="' + key + '">' + opts.map(function (o) { return '<button type="button" class="' + (val === o[0] ? 'on' : '') + '" data-pv="' + o[0] + '" style="min-width:0">' + o[1] + '</button>'; }).join('') + '</div>'; }
function tkWire_(d, f, redraw) { Array.prototype.forEach.call(d.querySelectorAll('[data-pk]'), function (g) { Array.prototype.forEach.call(g.querySelectorAll('[data-pv]'), function (b) { b.onclick = function () { f[g.dataset.pk] = b.dataset.pv; Array.prototype.forEach.call(g.querySelectorAll('[data-pv]'), function (x) { x.classList.toggle('on', x === b); }); if (redraw) redraw(); }; }); }); }
function tkNew_(pre) {
  var D = S.tk, today = D.today, f = pre || {who: 'store', pri: 'normal', due: 'today', rep: 'once', time: '', steps: []};
  var tpls = (D.tpls || []).slice(0, 8);
  var d = modal('<h2>مهمة جديدة</h2>' +
    (tpls.length ? '<label>ابدأ من قالب</label><div class="chips">' + tpls.map(function (p) { return '<button type="button" data-tp="' + esc(p.id) + '">' + esc(p.title) + '</button>'; }).join('') + '</div>' : '') +
    '<label>لمين؟</label><div class="tkwho">' + ['store', 'acc', 'claude', 'owner'].map(function (w) { return '<button type="button" data-w="' + w + '" class="' + (f.who === w ? 'on' : '') + '">' + tkAv_(w, 28) + (w === 'owner' ? 'نفسي' : TK_WHO[w][0]) + '</button>'; }).join('') + '</div>' +
    '<label for="tkt">وش المطلوب؟</label><input id="tkt" value="' + esc(f.title || '') + '" placeholder="مثال: أرسل كشف أعمار الديون"><label for="tkdt">تفاصيل (اختياري)</label><textarea id="tkdt" rows="2">' + esc(f.det || '') + '</textarea>' +
    '<label>الخطوات والدليل (اختياري)</label><div id="tkst"></div>' +
    '<label>متى؟</label>' + tkPick_(d, 'due', f.due, [['today', 'اليوم'], ['tom', 'بكرة'], ['tom2', 'بعد بكرة'], ['pick', 'تاريخ']]) + '<div id="tkdp" style="display:' + (f.due === 'pick' ? 'block' : 'none') + '"><input type="date" id="tkdd" min="' + today + '" value="' + today + '" aria-label="التاريخ"></div>' +
    '<label for="tktm">الساعة (اختياري)</label><input type="time" id="tktm" value="' + esc(f.time || '') + '">' +
    '<label>الأولوية</label>' + tkPick_(d, 'pri', f.pri, [['urgent', 'عاجل'], ['normal', 'عادي'], ['later', 'يقدر ينتظر']]) +
    '<label>تتكرر؟</label>' + tkPick_(d, 'rep', f.rep, [['once', 'مرة وحدة'], ['daily', 'كل يوم'], ['weekly', 'كل أسبوع']]) +
    '<div id="tkcap"></div><p class="muted" style="font-size:12.5px;margin:12px 2px 0">تنبيه الإيميل للموظف موقوف حالياً — يشوفها أول ما يدخل. وتقدر تعطي المهمة لكلود بالكلام في المكالمة أو الشات.</p>' +
    '<button class="btn" id="tks">أرسل المهمة</button><div id="tkms" class="msg"></div>');
  var steps = (f.steps || []).map(function (s) { return {t: s.t, need: s.need || ''}; });
  tkStepsUi_(d.querySelector('#tkst'), steps);
  var cap = function () { var n = (D.urgentToday || {})[f.who] || 0, c = D.cap || 3; d.querySelector('#tkcap').innerHTML = f.pri === 'urgent' && f.who !== 'owner' && f.due === 'today' && n >= c ? '<div class="tkwarn" style="margin-top:12px">' + I('alert', 18) + '<span>' + TK_WHO[f.who][0] + ' عنده اليوم ' + n + ' مهام عاجلة — وصل الحد. خلها «عادي» أو بكرة.</span></div>' : ''; d.querySelector('#tkdp').style.display = f.due === 'pick' ? 'block' : 'none'; };
  tkWire_(d, f, cap);
  Array.prototype.forEach.call(d.querySelectorAll('[data-w]'), function (b) { b.onclick = function () { f.who = b.dataset.w; Array.prototype.forEach.call(d.querySelectorAll('[data-w]'), function (x) { x.classList.toggle('on', x === b); }); cap(); }; });
  Array.prototype.forEach.call(d.querySelectorAll('[data-tp]'), function (b) { b.onclick = function () { var p = tpls.filter(function (t) { return t.id === b.dataset.tp; })[0]; d.remove(); tkNew_({who: p.who, pri: p.pri || 'normal', due: 'today', rep: 'once', time: p.time && p.time !== '23:59' ? p.time : '', title: p.title, det: p.det, steps: p.steps}); }; });
  cap();
  var send = function (force) {
    var b = d.querySelector('#tks'), day = f.due === 'today' ? today : (f.due === 'tom' ? tkAdd_(today, 1) : (f.due === 'tom2' ? tkAdd_(today, 2) : d.querySelector('#tkdd').value)), tm = d.querySelector('#tktm').value;
    busy(b, true);
    call('taskSave', S.t, {who: f.who, title: d.querySelector('#tkt').value, det: d.querySelector('#tkdt').value, steps: steps.filter(function (s) { return String(s.t).trim(); }), due: day + (tm ? ' ' + tm : ''), pri: f.pri, rep: f.rep, force: !!force})
      .then(function () { d.remove(); toast('انرسلت المهمة'); tkLoad_(function () { if (S.tab === 'tasks') tkRender_(); }); })
      .catch(function (e) { busy(b, false); var m = String(e.message); if (m.indexOf('CAP|') === 0) { msg('tkms', m.slice(4)); var x = document.createElement('button'); x.className = 'btn l'; x.textContent = 'أرسلها رغم كذا'; x.onclick = function () { x.remove(); send(true); }; d.querySelector('#tkms').after(x); } else msg('tkms', m); });
  };
  d.querySelector('#tks').onclick = function () { send(false); };
}
function tkTpl_() {
  var f = {who: 'store', pri: 'normal', every: 'daily', wd: '0', md: '1'}, steps = [];
  var d = modal('<h2>قالب جديد</h2><label>لمين؟</label><div class="tkwho">' + ['store', 'acc', 'claude', 'owner'].map(function (w) { return '<button type="button" data-w="' + w + '" class="' + (f.who === w ? 'on' : '') + '">' + tkAv_(w, 28) + (w === 'owner' ? 'نفسي' : TK_WHO[w][0]) + '</button>'; }).join('') + '</div>' +
    '<label for="tpt">وش المطلوب؟</label><input id="tpt" placeholder="مثال: تقرير الصندوق اليومي"><label for="tpd">تفاصيل (اختياري)</label><textarea id="tpd" rows="2"></textarea><label>الخطوات والدليل</label><div id="tpst"></div>' +
    '<label>يتكرر</label>' + tkPick_(d, 'every', f.every, [['daily', 'كل يوم'], ['weekly', 'كل أسبوع'], ['monthly', 'كل شهر'], ['none', 'وقت الحاجة']]) +
    '<div id="tpwd" style="display:none"><label for="tpw">أي يوم؟</label><select id="tpw">' + DAYS.map(function (x, i) { return '<option value="' + i + '">' + x + '</option>'; }).join('') + '</select></div>' +
    '<div id="tpmd" style="display:none"><label for="tpm">يوم كم من الشهر؟</label><select id="tpm">' + Array.apply(null, Array(28)).map(function (x, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') + '</select></div>' +
    '<label for="tptm">الموعد</label><input type="time" id="tptm" value="23:00"><label>الأولوية</label>' + tkPick_(d, 'pri', f.pri, [['urgent', 'عاجل'], ['normal', 'عادي'], ['later', 'يقدر ينتظر']]) +
    '<button class="btn" id="tps">حفظ القالب</button><div id="tpms" class="msg"></div>');
  tkStepsUi_(d.querySelector('#tpst'), steps);
  tkWire_(d, f, function () { d.querySelector('#tpwd').style.display = f.every === 'weekly' ? 'block' : 'none'; d.querySelector('#tpmd').style.display = f.every === 'monthly' ? 'block' : 'none'; });
  Array.prototype.forEach.call(d.querySelectorAll('[data-w]'), function (b) { b.onclick = function () { f.who = b.dataset.w; Array.prototype.forEach.call(d.querySelectorAll('[data-w]'), function (x) { x.classList.toggle('on', x === b); }); }; });
  d.querySelector('#tps').onclick = function () {
    var b = this, ev = f.every === 'weekly' ? 'w:' + d.querySelector('#tpw').value : (f.every === 'monthly' ? 'm:' + d.querySelector('#tpm').value : f.every);
    busy(b, true);
    call('tplSave', S.t, {who: f.who, title: d.querySelector('#tpt').value, det: d.querySelector('#tpd').value, steps: steps.filter(function (s) { return String(s.t).trim(); }), every: ev, time: d.querySelector('#tptm').value, pri: f.pri})
      .then(function () { d.remove(); toast('انحفظ القالب'); tkLoad_(function () { if (S.tab === 'tasks') tkRender_(); }); }).catch(function (e) { busy(b, false); msg('tpms', e.message); });
  };
}

</script>
<div id="prt"></div>
</body>
